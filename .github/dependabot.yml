version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "numpy"
        versions: [">= 2.0.0"]
      - dependency-name: "urllib3"
        versions: [">= 2.0.0"]
      - dependency-name: "tensorflow"
        versions: [">= 2.10.0"]
      - dependency-name: "protobuf"
        versions: [">= 4.0.0"]
    reviewers:
      - "guljarhussain0560"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
